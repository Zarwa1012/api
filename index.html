<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Surprise For You 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f4;--grid:#ebe4de;--ink:#8b1e3f;--soft:#a65a72;--card:#f7dce4;--btn:#a8325e;--btnt:#fff;--shape:#b83a68;--h:#f08fb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1519;--grid:#2b2025;--ink:#f3b6c9;--soft:#d79ab0;--card:#3a2630;--h:#d86c92}}
:root[data-theme="dark"]{--bg:#1d1519;--grid:#2b2025;--ink:#f3b6c9;--soft:#d79ab0;--card:#3a2630;--h:#d86c92}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;width:100%;max-width:100%;min-height:100%;overflow-x:hidden}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:'Caveat','Segoe Script',cursive;color:var(--ink);
  position:relative;min-height:100vh;min-height:100dvh;
  transition:background-color .7s;touch-action:manipulation;
  scrollbar-width:none;-ms-overflow-style:none;
}
body::-webkit-scrollbar{display:none;width:0;height:0}

/* per-page moods */
body[data-p=env],body[data-p=letter]{--bg:#f6ead8;--grid:#eddcc2;--ink:#8b1e3f;--soft:#a65a72;--card:#fbf3e3;--h:#e9a0b4}
body[data-p=love]{--bg:#d8205a;--grid:#e0386c;--ink:#fff;--soft:#ffe3ec;--h:#ffc2d5;--btn:#fff;--btnt:#d8205a;--shape:#ff5c8a}
body[data-p=hug],body[data-p=gift]{--bg:#fcd5e1;--grid:#f8c3d3;--ink:#a3224f;--soft:#b2587a;--h:#ee6f9a;--shape:#f493b0;--btn:#a8325e;--btnt:#fff}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.blob{position:fixed;z-index:0;border-radius:50%;background:var(--shape);opacity:.9;transition:background .7s;pointer-events:none;will-change:transform}
.b1{left:-18vmin;top:22%;width:36vmin;height:58vmin;transform:translate(calc(var(--mx,0)*-26px),calc(var(--my,0)*-26px))}
.b2{right:-22vmin;bottom:-22vmin;width:60vmin;height:60vmin;transform:translate(calc(var(--mx,0)*34px),calc(var(--my,0)*34px))}
.b3{right:8vmin;top:-9vmin;width:20vmin;height:20vmin;opacity:.45;transform:translate(calc(var(--mx,0)*-50px),calc(var(--my,0)*-50px))}

/* ---------- layout: the PAGE scrolls (no nested scroll boxes) ---------- */
#stage{
  position:relative;z-index:1;width:100%;min-width:0;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 60px) 12px calc(env(safe-area-inset-bottom,0px) + 28px);
}
.page{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,1.8vh,16px);text-align:center;
  width:100%;max-width:1000px;min-width:0;
  padding:clamp(6px,2vw,24px);
  animation:in .55s ease;
}
.page.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

h1,h2{font-family:'Dancing Script','Brush Script MT',cursive;margin:0;color:var(--ink);line-height:1.1;overflow-wrap:anywhere;max-width:100%}
h1{font-size:clamp(38px,10vw,84px)}
h2{font-size:clamp(30px,8vw,56px)}
p{margin:0;font-size:clamp(21px,5.5vw,32px);color:var(--soft);line-height:1.25;overflow-wrap:anywhere;max-width:100%}

.cat{width:clamp(120px,36vw,230px);height:auto;max-width:100%;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));cursor:pointer;-webkit-user-drag:none}
.cat.flip{transform:scaleX(-1)}
.cat.mad{filter:grayscale(.7) contrast(1.1) drop-shadow(0 6px 8px rgba(0,0,0,.25));animation:shake .35s infinite}
.catw{position:relative;display:inline-block}
.catw:after{content:attr(data-e);position:absolute;right:-6%;top:-6%;font-size:clamp(30px,9vw,56px);animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes shake{25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}

.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:100%}
button{
  font:700 clamp(22px,5.5vw,30px) 'Dancing Script',cursive;
  background:var(--btn);color:var(--btnt);border:0;border-radius:999px;
  padding:8px 28px;min-height:46px;max-width:100%;
  cursor:pointer;text-decoration:underline;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .15s;
  -webkit-tap-highlight-color:transparent;
}
button:hover{transform:scale(1.06) rotate(-1deg)}
button:active{transform:translateY(3px)}
button:focus-visible,#envsvg:focus-visible{outline:3px solid #7b2447;outline-offset:4px}
.ghost{background:none;color:var(--ink);box-shadow:none;font-size:clamp(20px,5vw,24px)}
.reset-btn{background:linear-gradient(135deg,#fff0f5,#f6b9cf);color:#8b1e3f;border:2px solid #fff;border-radius:18px;box-shadow:0 5px 0 #d98aa8;padding:10px 22px;font-size:clamp(20px,5vw,27px);text-decoration:none}
.reset-btn:hover{transform:translateY(-2px)}

/* envelope */
#envsvg{width:clamp(220px,70vw,400px);max-width:100%;height:auto;overflow:visible;cursor:pointer;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(120,30,60,.25))}
#envsvg .flap{transition:transform .3s ease;transform-origin:0 52px}
#envsvg .flapb{opacity:0;transition:opacity .2s .25s}
#envsvg .paper{transition:transform .8s ease .5s}
#envsvg .seal{transition:opacity .2s}
#envsvg.open{animation:none}
#envsvg.open .flap{transform:scaleY(0)}
#envsvg.open .flapb{opacity:1}
#envsvg.open .paper{transform:translateY(-62px)}
#envsvg.open .seal{opacity:0}

/* letter */
.letter{background:var(--card);border-radius:14px;width:min(100%,850px);padding:clamp(16px,4vw,34px);box-shadow:0 10px 26px rgba(0,0,0,.2)}
.letter h3{font:700 clamp(28px,6vw,46px) 'Dancing Script',cursive;margin:0 0 8px;color:var(--ink);overflow-wrap:anywhere}
.letter p,#letterText{color:var(--ink);font-size:clamp(20px,4.6vw,30px);line-height:1.4;white-space:pre-line;overflow-wrap:anywhere}

/* hanging polaroids (desktop / tablet: JS positions them) */
.strip{position:relative;width:100%;max-width:1000px;height:clamp(360px,47vw,500px);flex:none}
.strip svg{position:absolute;inset:0;width:100%;height:60px;overflow:visible}
.pol{position:absolute;width:15.5%;background:#fff;padding:7px 7px 28px;box-shadow:0 8px 16px rgba(0,0,0,.3);cursor:pointer;transform-origin:50% 0;animation:sway 4s ease-in-out infinite;transition:transform .2s}
.pol:hover{animation-duration:1s}
.pol i{position:absolute;left:50%;top:-12px;width:12px;height:26px;margin-left:-6px;border-radius:3px;background:var(--pc);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.pol div{aspect-ratio:4/5;background:linear-gradient(135deg,#ffd0df,#d86a92);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,40px);overflow:hidden}
.pol img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes sway{0%,100%{rotate:calc(var(--r)*1deg)}50%{rotate:calc(var(--r)*1deg + 4deg)}}
.hint{font-size:clamp(20px,5vw,28px);opacity:.9}

/* gift */
.gift{font-size:clamp(110px,34vw,200px);cursor:pointer;background:none;border:0;box-shadow:none;text-decoration:none;padding:0;min-height:0;line-height:1.25;margin:14px 0 6px;animation:bob 1.8s ease-in-out infinite}
.gift.pop{animation:pop .6s forwards}
@keyframes pop{to{transform:scale(1.7) rotate(12deg);opacity:0}}

/* hug scene */
.hw{position:relative;width:100%;display:flex;justify-content:center}
#hugsvg{width:min(92vw,520px);max-width:100%;height:auto;cursor:pointer;overflow:visible}
#hugsvg .bd{fill:var(--bf);stroke:var(--bs);stroke-width:3}
#hugsvg .w{--bf:#fffaf4;--bs:#8b5e4b}
#hugsvg .b{--bf:#c48a63;--bs:#6b4130}
.cl,.cr{transform:translateX(-95px)}
.cr{transform:translateX(95px)}
.go .cl{animation:walk 1.3s cubic-bezier(.3,1.35,.5,1) forwards}
.go .cr{animation:walk 1.3s cubic-bezier(.3,1.35,.5,1) forwards;--s:1}
@keyframes walk{to{transform:translateX(0)}}
.afl,.afr{transform:rotate(0)}
.go .afl{animation:ahl .7s 1.3s ease forwards}
.go .afr{animation:ahr .7s 1.3s ease forwards}
@keyframes ahl{to{transform:rotate(-98deg)}}
@keyframes ahr{to{transform:rotate(98deg)}}
.eh{opacity:0}
.go .eo{animation:off .01s 1.9s forwards}
.go .eh{animation:on .01s 1.9s forwards}
@keyframes off{to{opacity:0}}
@keyframes on{to{opacity:1}}
.go .sq{animation:sq 1.1s 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sq{50%{transform:scale(1.03,.96)}}
.hw .hs{position:absolute;bottom:55%;font-size:30px;opacity:0;pointer-events:none}
.go .hs{animation:up 2.8s 2s ease-out infinite}
.go .hs:nth-of-type(2){left:38%;animation-delay:2.6s}
.go .hs:nth-of-type(3){left:50%;animation-delay:3.2s}
.go .hs:nth-of-type(4){left:62%;animation-delay:2.9s}
@keyframes up{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) scale(1.2)}}

/* sound buttons (always pinned top-right, never over the content) */
.snd{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;display:flex;gap:8px}
.snd button{font-size:clamp(16px,4vw,22px);padding:6px 14px;min-width:44px;min-height:44px;text-decoration:none;line-height:1;background:rgba(255,255,255,.88);color:#a8325e;box-shadow:0 2px 6px rgba(0,0,0,.2)}

.fall{position:fixed;top:-40px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* ---------- PHONES: polaroids become a neat 2-column grid ---------- */
@media (max-width:650px){
  #stage{padding-left:10px;padding-right:10px}
  .strip{
    height:auto;max-width:440px;
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:26px 18px;padding:20px 8px 8px;
  }
  .strip svg{display:none}
  .pol{position:relative;left:auto!important;top:auto!important;width:auto!important;padding:6px 6px 22px}
  .pol i{top:-10px;width:10px;height:22px;margin-left:-5px}
  .pol div{aspect-ratio:1}
  .row{gap:10px}
}
@media (max-width:360px){
  button{padding:8px 20px}
  .strip{gap:22px 12px}
}

/* landscape phones: less vertical padding */
@media (max-height:480px) and (orientation:landscape){
  #stage{padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
  .cat{width:clamp(90px,22vh,150px)}
}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body data-p="ask">
<canvas id="bg"></canvas>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="stage">

<section class="page on" id="ask">
  <img class="cat" data-cat alt="Cute cat hugging a love letter">
  <h1>HEY!!</h1>
  <p id="askLine"></p>
  <div class="row"><button data-go="yes">Yes</button><button data-go="dare">No</button></div>
</section>

<section class="page" id="dare">
  <div class="catw" data-e="💢"><img class="cat mad" data-cat alt="Angry cat"></div>
  <h1>HOW DARE YOU</h1>
  <button data-go="ask">Go back</button>
</section>

<section class="page" id="yes">
  <div class="catw" data-e="💋"><img class="cat flip" data-cat alt="Happy cat"></div>
  <h2>That's a good Gurlll 💋</h2>
  <button data-go="bday">Click</button>
</section>

<section class="page" id="bday">
  <div class="catw" data-e="🎉"><img class="cat" data-cat alt="Party cat"></div>
  <h1 id="bdayTitle"></h1>
  <p id="bdayLine"></p>
  <button data-go="env">Next</button>
</section>

<section class="page" id="env">
  <svg id="envsvg" viewBox="0 -40 240 220" role="button" tabindex="0" aria-label="Open the envelope">
    <rect x="10" y="52" width="220" height="120" rx="8" fill="#e9a0b4"/>
    <path class="flapb" d="M10 52 H230 L120 -24 Z" fill="#f3a9bc" stroke="#e591a7" stroke-width="2" stroke-linejoin="round"/>
    <g class="paper"><rect x="28" y="62" width="184" height="100" rx="5" fill="#f4ead2"/><path d="M48 86h144M48 104h144M48 122h96" stroke="#cdb98f" stroke-width="4" stroke-linecap="round"/></g>
    <path d="M10 60 L120 135 L230 60 V164 a8 8 0 0 1-8 8 H18 a8 8 0 0 1-8-8Z" fill="#f6bccb"/>
    <path d="M12 168 L108 112 M228 168 L132 112" stroke="#e591a7" stroke-width="3" fill="none"/>
    <g class="flap"><path d="M10 52 H230 L120 128 Z" fill="#f9cbd7" stroke="#e591a7" stroke-width="2" stroke-linejoin="round"/>
      <g class="seal"><circle cx="120" cy="118" r="17" fill="#c9304f"/><path d="M120 128 C108 120 108 109 114 108 C117 107.500 119 109 120 111 C121 109 123 107.500 126 108 C132 109 132 120 120 128Z" fill="#f5a3b4"/></g></g>
  </svg>
  <h2>Tap here to open</h2>
</section>

<section class="page" id="letter">
  <div class="letter"><h3 id="greet"></h3><p id="letterText"></p></div>
  <div class="row" style="font-size:44px">💗 💗</div>
  <button data-go="love">Click here</button>
</section>

<section class="page" id="love">
  <div class="strip" id="strip"><svg viewBox="0 0 640 60" preserveAspectRatio="none"><path d="M0 8 Q320 62 640 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>
  <h1 style="margin-top:6px">I LOVE YOU</h1>
  <p id="loveLine"></p>
  <p class="hint">Tap a photo to add your own</p>
  <button data-go="gift">Click here</button>
</section>

<section class="page" id="gift">
  <h2>Here's a surprise for you!!!</h2>
  <button class="gift" id="giftBox" aria-label="Open the gift">🎁</button>
  <p>Tap here</p>
</section>

<section class="page" id="hug">
  <h2>Here is a virtual hug for you</h2>
  <div class="hw">
    <svg id="hugsvg" viewBox="0 0 420 300" role="img" aria-label="Two cartoon bears hugging">
      <ellipse cx="210" cy="276" rx="130" ry="12" fill="rgba(0,0,0,.14)"/>
      <g transform="translate(170 118)"><g class="cl"><g class="sq w">
        <ellipse cx="0" cy="68" rx="42" ry="48" class="bd"/>
        <circle cx="-28" cy="-34" r="13" class="bd"/><circle cx="28" cy="-34" r="13" class="bd"/><circle cx="0" cy="0" r="38" class="bd"/>
        <g class="eo"><circle cx="-14" cy="-4" r="4" fill="#4a2c20"/><circle cx="14" cy="-4" r="4" fill="#4a2c20"/></g>
        <g class="eh"><path d="M-20 -2q6-9 12 0M8 -2q6-9 12 0" fill="none" stroke="#4a2c20" stroke-width="3" stroke-linecap="round"/></g>
        <ellipse cx="-24" cy="10" rx="7" ry="4" fill="#f7a8b8"/><ellipse cx="24" cy="10" rx="7" ry="4" fill="#f7a8b8"/>
        <ellipse cx="0" cy="7" rx="6" ry="4" fill="#4a2c20"/><path d="M-6 15q6 6 12 0" fill="none" stroke="#4a2c20" stroke-width="2.500" stroke-linecap="round"/>
        <g transform="translate(-34 40)"><rect x="-10" y="0" width="20" height="54" rx="10" class="bd"/></g>
      </g></g></g>
      <g transform="translate(250 118)"><g class="cr"><g class="sq b">
        <ellipse cx="0" cy="68" rx="42" ry="48" class="bd"/>
        <circle cx="-28" cy="-34" r="13" class="bd"/><circle cx="28" cy="-34" r="13" class="bd"/><circle cx="0" cy="0" r="38" class="bd"/>
        <ellipse cx="0" cy="10" rx="17" ry="13" fill="#e9c9a8"/>
        <g class="eo"><circle cx="-14" cy="-6" r="4" fill="#2e1a12"/><circle cx="14" cy="-6" r="4" fill="#2e1a12"/></g>
        <g class="eh"><path d="M-20 -4q6-9 12 0M8 -4q6-9 12 0" fill="none" stroke="#2e1a12" stroke-width="3" stroke-linecap="round"/></g>
        <ellipse cx="-26" cy="8" rx="7" ry="4" fill="#f09aae"/><ellipse cx="26" cy="8" rx="7" ry="4" fill="#f09aae"/>
        <ellipse cx="0" cy="6" rx="6" ry="4" fill="#2e1a12"/><path d="M-6 15q6 6 12 0" fill="none" stroke="#2e1a12" stroke-width="2.500" stroke-linecap="round"/>
        <g transform="translate(34 40)"><rect x="-10" y="0" width="20" height="54" rx="10" class="bd"/></g>
      </g></g></g>
      <!-- front arms wrap around each other -->
      <g transform="translate(170 118)"><g class="cl w"><g transform="translate(34 40)"><g class="afl"><rect x="-10" y="0" width="20" height="62" rx="10" class="bd"/></g></g></g></g>
      <g transform="translate(250 118)"><g class="cr b"><g transform="translate(-34 40)"><g class="afr"><rect x="-10" y="0" width="20" height="62" rx="10" class="bd"/></g></g></g></g>
    </svg>
    <span class="hs" style="left:26%">💗</span><span class="hs">💖</span><span class="hs">💕</span><span class="hs">💗</span>
  </div>
  <p>Sending you the biggest hug 🤗</p>
  <div class="row"><button class="ghost" id="again">Hug again ↺</button><button id="reset" class="reset-btn">Start over</button></div>
</section>

</div>
<div class="snd"><button id="mute" aria-label="Sound on or off">🔊</button><button id="song" aria-label="Add your own song" title="Add your own song">🎵</button></div>
<audio id="bgMusic" src="audio.mp3" loop preload="auto"></audio>
<input type="file" id="aud" accept="audio/*" hidden>
<input type="file" id="file" accept="image/*" hidden>

<script>
// ✏️ EDIT THESE to personalise the surprise
const CONFIG = {
  name: "Nayab",
  askLine: "I made something special for you. Do you want to see?",
  bdayLine: "Happy Birthday Nayab 🎂❤️",
  greet: "Happy Birthday Nayab 🎂❤️",
  letter: "Happy Birthday Nayab 🎂❤️\nI miss you so much yaar, you are my jaan 🥺❤️ You are so far now but still so close to my heart. You are my comfort person hamesha. Life ke best days maine tumhare saath guzare hain, and I will always cherish them.\nAllah tumhe dher sari khushiyan de, tumhara naseeb bht acha kare. Kaash main wahan hoti tumhare saath cake cut karne ke liye, but I am sending you all my love and duas from far.\nLove you so much meri pyaari jan❤️❤️❤️❤️😍be Happy Always.\nDont forget I am always here for you🫂🫂❤️❤️",
  loveLine: "I miss you so much, meri jaan ❤️"
};

218%22 fill=%22none%22 stroke=%22%23a8325e%22 stroke-width=%224%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M150 266 c-14 -9 -14 -20 -7 -21 c3 0 6 2 7 5 c1 -3 4 -5 7 -5 c7 1 7 12 -7 21z%22 fill=%22%23d8205a%22/%3E%3Cellipse cx=%2296%22 cy=%22248%22 rx=%2216%22 ry=%2212%22 fill=%22%23f2b88c%22 stroke=%22%237a4a2e%22 stroke-width=%224%22/%3E%3Cellipse cx=%22204%22 cy=%22248%22 rx=%2216%22 ry=%2212%22 fill=%22%23f2b88c%22 stroke=%22%237a4a2e%22 stroke-width=%224%22/%3E%3C/svg%3E";
document.querySelectorAll("[data-cat]").forEach(i => i.src = CAT);
const $ = id => document.getElementById(id);
$('askLine').textContent = CONFIG.askLine;
$('bdayTitle').textContent = "HAPPY BIRTHDAY NAYAB 🎂❤️";
$('bdayLine').textContent = CONFIG.bdayLine;
$('greet').textContent = CONFIG.greet;
$('letterText').textContent = CONFIG.letter;
$('loveLine').textContent = CONFIG.loveLine;

// 🔊 audio
let AC, master, started = false, musicOn = true, loopT, curRun, userAudio = null;
function ac(){ if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination); } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t, d, type, v, dest){ const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v || .2, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + .05); }
function stopMusic(){
  clearTimeout(loopT);
  if (curRun) { curRun.disconnect(); curRun = null; }
  const music = $('bgMusic');
  if (music) music.pause();
  if (userAudio) userAudio.pause();
}
function startMusic(){
  stopMusic();
  if (!musicOn) return;
  const music = $('bgMusic');
  if (music) music.play().catch(() => { /* Tap the music button if autoplay is blocked. */ });
}
function sfx(n){
  if (!AC || !musicOn) return;
  const t = AC.currentTime;
  if (n === 'click') { tone(880, t, .12, 'sine', .18); tone(1320, t + .05, .12, 'sine', .12); }
  else if (n === 'buzz') { tone(140, t, .35, 'sawtooth', .12); tone(110, t + .1, .35, 'sawtooth', .1); }
  else if (n === 'pop') { tone(300, t, .15, 'square', .1); tone(700, t + .08, .25, 'triangle', .18); }
  else if (n === 'open') [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * .09, .4, 'sine', .16));
  else if (n === 'cheer') [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, t + i * .1, .6, 'triangle', .14));
}
addEventListener('pointerdown', e => {
  if (started || e.target.closest('.snd')) return;
  started = true;
  if (musicOn) startMusic();
});
$('mute').onclick = () => {
  musicOn = !musicOn;
  $('mute').textContent = musicOn ? '🔊' : '🔇';
  if (musicOn) { started = true; startMusic(); }
  else stopMusic();
};
$('song').setAttribute('aria-label', 'Play background music audio.mp3');
$('song').title = 'Play background music';
$('song').textContent = '🎵';
$('song').onclick = () => {
  musicOn = true;
  started = true;
  $('mute').textContent = '🔊';
  startMusic();
};
$('aud').onchange = () => { const f = $('aud').files[0]; if (!f) return; stopMusic(); userAudio = new Audio(URL.createObjectURL(f)); userAudio.loop = true; musicOn = true; started = true; $('mute').textContent = '🔊'; startMusic(); $('aud').value = ''; };

// 🔄 reset everything back to the start
function reset(){
  target = null;
  document.querySelectorAll('.pol img').forEach((img, i) => { img.src = `photo${i + 1}.jpeg`; });
  $('envsvg').classList.remove('open'); $('hugsvg').classList.remove('go'); show('ask');
}
$('reset').onclick = reset;

let heartCol = '#f08fb0';
function show(id){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === id));
  document.body.dataset.p = id;
  window.scrollTo(0, 0);
  setTimeout(() => { heartCol = getComputedStyle(document.body).getPropertyValue('--h').trim() || heartCol; }, 50);
  sfx({dare:'buzz',bday:'cheer',hug:'cheer'}[id] || 'click');
  if (id === 'bday') confetti(['🎉','🎂','💗','✨']);
  if (id === 'env') $('envsvg').classList.remove('open');
  if (id === 'hug') hug();
  burst(innerWidth / 2, innerHeight / 2, 18);
}
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t) show(t.dataset.go); });

// envelope opens, then the letter appears
function openEnvelope(){
  const s = $('envsvg');
  if (s.classList.contains('open')) return;
  s.classList.add('open');
  sfx('open');
  setTimeout(() => show('letter'), 1500);
}
$('envsvg').addEventListener('click', openEnvelope);
$('envsvg').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    openEnvelope();
  }
});
$('giftBox').addEventListener('click', e => {
  const b = e.currentTarget; b.classList.add('pop'); sfx('pop');
  setTimeout(() => { b.classList.remove('pop'); show('hug'); }, 600);
});

// the hug
function hug(){ const s = $('hugsvg'); s.classList.remove('go'); void s.getBoundingClientRect(); s.classList.add('go'); }
$('again').onclick = () => { hug(); confetti(['💖','🤍','🌸']); };
$('hugsvg').onclick = () => { hug(); };

// hanging polaroids
const strip = $('strip'), file = $('file'); let target = null;
const pegs = ['#7ed6c9','#b79cf2','#ffd36e','#8ec5ff','#f49ac2','#a5d6a7'];
const tops = [28,72,42,92,28,72], rots = [-6,3,-3,5,-4,4];
const photoCards = [];
// On phones the CSS turns the strip into a grid, so we only position on bigger screens.
function layoutPhotos() {
  const mobile = window.matchMedia('(max-width: 650px)').matches;
  photoCards.forEach((p, i) => {
    if (mobile) { p.style.left = ''; p.style.top = ''; p.style.width = ''; return; }
    p.style.left = (1 + i * 16.2) + '%';
    p.style.top = tops[i] + 'px';
    p.style.width = '15.5%';
  });
}
for (let i = 0; i < 6; i++) {
  const p = document.createElement('div');
  p.className = 'pol';
  p.style.cssText = `--r:${rots[i]};--pc:${pegs[i]};animation-delay:${-i}s`;
  p.innerHTML = `<i></i><div><img src="photo${i + 1}.jpeg" alt="Photo ${i + 1}" onerror="this.parentElement.textContent='📷'"></div>`;
  p.onclick = () => { target = p; file.click(); };
  strip.appendChild(p); photoCards.push(p);
}
layoutPhotos();
window.addEventListener('resize', layoutPhotos, { passive:true });
file.onchange = () => {
  const f = file.files[0]; if (!f || !target) return;
  const r = new FileReader();
  r.onload = () => { target.querySelector('div').innerHTML = '<img alt="photo" src="' + r.result + '">'; };
  r.readAsDataURL(f); file.value = '';
};

function confetti(set){
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    s.className = 'fall'; s.textContent = set[i % set.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = 18 + Math.random() * 24 + 'px';
    s.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
    s.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 7000);
  }
}

// ✨ interactive background
const cv = $('bg'), ctx = cv.getContext('2d');
let W, H, hearts = [], bits = [], ptr = {x: -999, y: -999}, ptrT;
function seed(){
  const n = Math.round(Math.max(14, Math.min(46, W * H / 26000)));
  while (hearts.length < n) hearts.push(mk(true));
  hearts.length = n;
}
function mk(any){ return {x: Math.random() * W, y: any ? Math.random() * H : H + 30, s: 6 + Math.random() * 14, v: .3 + Math.random() * .7, ph: Math.random() * 6, r: (Math.random() - .5) * .6, a: .25 + Math.random() * .4, dx: 0, dy: 0}; }
function size(){
  const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); seed();
}
addEventListener('resize', size); size();
function hp(x, y, s, r){
  ctx.save(); ctx.translate(x, y); ctx.rotate(r); ctx.scale(s, s); ctx.beginPath();
  ctx.moveTo(0, .9); ctx.bezierCurveTo(-1.2, .1, -.9, -.9, 0, -.35); ctx.bezierCurveTo(.9, -.9, 1.2, .1, 0, .9); ctx.fill(); ctx.restore();
}
function burst(x, y, n){ for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 1.5 + Math.random() * 3.5; bits.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, l: 1, s: 5 + Math.random() * 9}); } }
let t = 0;
(function loop(){
  t += .016; ctx.clearRect(0, 0, W, H); ctx.fillStyle = heartCol;
  for (const h of hearts) {
    const ddx = h.x - ptr.x, ddy = h.y - ptr.y, d2 = ddx * ddx + ddy * ddy;
    if (d2 < 15000) { const f = (15000 - d2) / 15000 * 3, d = Math.sqrt(d2) || 1; h.dx += ddx / d * f; h.dy += ddy / d * f; }
    h.dx *= .9; h.dy *= .9;
    h.y -= h.v; h.x += Math.sin(t + h.ph) * .4 + h.dx; h.y += h.dy;
    if (h.y < -30) Object.assign(h, mk(false));
    ctx.globalAlpha = h.a; hp(h.x, h.y, h.s, h.r + Math.sin(t + h.ph) * .2);
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.x += b.vx; b.y += b.vy; b.vy += .08; b.l -= .018;
    if (b.l <= 0) { bits.splice(i, 1); continue; }
    ctx.globalAlpha = b.l; hp(b.x, b.y, b.s * b.l + 2, b.x * .01);
  }
  ctx.globalAlpha = 1; requestAnimationFrame(loop);
})();
addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; clearTimeout(ptrT); ptrT = setTimeout(() => ptr.x = ptr.y = -999, 900);
  const r = document.documentElement.style; r.setProperty('--mx', (e.clientX / W - .5).toFixed(3)); r.setProperty('--my', (e.clientY / H - .5).toFixed(3));
});
addEventListener('pointerdown', e => { burst(e.clientX, e.clientY, 14); ptr.x = e.clientX; ptr.y = e.clientY; });
addEventListener('deviceorientation', e => { // phone tilt moves the background shapes
  if (e.gamma == null) return; const r = document.documentElement.style;
  r.setProperty('--mx', Math.max(-.5, Math.min(.5, e.gamma / 60)).toFixed(3)); r.setProperty('--my', Math.max(-.5, Math.min(.5, (e.beta - 40) / 80)).toFixed(3));
});
</script>
