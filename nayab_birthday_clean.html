<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Surprise For You 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f4;--grid:#ebe4de;--ink:#8b1e3f;--soft:#a65a72;--card:#f7dce4;--btn:#a8325e;--btnt:#fff;--shape:#b83a68;--h:#f08fb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1519;--grid:#2b2025;--ink:#f3b6c9;--soft:#d79ab0;--card:#3a2630;--h:#d86c92}}
:root[data-theme="dark"]{--bg:#1d1519;--grid:#2b2025;--ink:#f3b6c9;--soft:#d79ab0;--card:#3a2630;--h:#d86c92}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;font-family:'Caveat','Segoe Script',cursive;color:var(--ink);overflow:hidden;position:relative;transition:background-color .7s;touch-action:manipulation}
/* per-page moods */
body[data-p=env],body[data-p=letter]{--bg:#f6ead8;--grid:#eddcc2;--ink:#8b1e3f;--soft:#a65a72;--card:#fbf3e3;--h:#e9a0b4}
body[data-p=love]{--bg:#d8205a;--grid:#e0386c;--ink:#fff;--soft:#ffe3ec;--h:#ffc2d5;--btn:#fff;--btnt:#d8205a;--shape:#ff5c8a}
body[data-p=hug],body[data-p=gift]{--bg:#fcd5e1;--grid:#f8c3d3;--ink:#a3224f;--soft:#b2587a;--h:#ee6f9a;--shape:#f493b0;--btn:#a8325e;--btnt:#fff}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.blob{position:fixed;z-index:0;border-radius:50%;background:var(--shape);opacity:.9;transition:background .7s;pointer-events:none;will-change:transform}
.b1{left:-18vmin;top:22%;width:36vmin;height:58vmin;transform:translate(calc(var(--mx,0)*-26px),calc(var(--my,0)*-26px))}
.b2{right:-22vmin;bottom:-22vmin;width:60vmin;height:60vmin;transform:translate(calc(var(--mx,0)*34px),calc(var(--my,0)*34px))}
.b3{right:8vmin;top:-9vmin;width:20vmin;height:20vmin;opacity:.45;transform:translate(calc(var(--mx,0)*-50px),calc(var(--my,0)*-50px))}
#stage{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.page{display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;width:100%;max-width:680px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;pointer-events:none;animation:in .55s ease}
.page.on{display:flex}.page>*{pointer-events:auto}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
h1,h2{font-family:'Dancing Script','Brush Script MT',cursive;margin:0;color:var(--ink);line-height:1.1}
h1{font-size:clamp(48px,12vw,84px)}h2{font-size:clamp(36px,9vw,56px)}
p{margin:0;font-size:clamp(24px,6vw,32px);color:var(--soft);line-height:1.2}
.cat{width:clamp(130px,38vw,230px);height:auto;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));cursor:pointer;-webkit-user-drag:none}
.cat.flip{transform:scaleX(-1)}
.cat.mad{filter:grayscale(.7) contrast(1.1) drop-shadow(0 6px 8px rgba(0,0,0,.25));animation:shake .35s infinite}
.catw{position:relative;display:inline-block}
.catw:after{content:attr(data-e);position:absolute;right:-6%;top:-6%;font-size:clamp(34px,10vw,56px);animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes shake{25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{font:700 clamp(26px,7vw,34px) 'Dancing Script',cursive;background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:8px 30px;cursor:pointer;text-decoration:underline;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .15s}
button:hover{transform:scale(1.08) rotate(-1deg)}button:active{transform:translateY(3px)}button:focus-visible,#envsvg:focus-visible{outline:3px solid #7b2447;outline-offset:4px}
.ghost{background:none;color:var(--ink);box-shadow:none;font-size:24px}
/* envelope */
#envsvg{width:clamp(240px,70vw,400px);overflow:visible;cursor:pointer;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(120,30,60,.25))}
#envsvg .flap{transition:transform .3s ease;transform-origin:0 52px}#envsvg .flapb{opacity:0;transition:opacity .2s .25s}
#envsvg .paper{transition:transform .8s ease .5s}
#envsvg .seal{transition:opacity .2s}
#envsvg.open{animation:none}#envsvg.open .flap{transform:scaleY(0)}#envsvg.open .flapb{opacity:1}#envsvg.open .paper{transform:translateY(-62px)}#envsvg.open .seal{opacity:0}
.letter{background:var(--card);border-radius:14px;padding:22px 26px;max-width:470px;box-shadow:0 10px 26px rgba(0,0,0,.2);transform:rotate(-1.5deg)}
.letter h3{font:700 clamp(28px,7vw,38px) 'Dancing Script',cursive;margin:0 0 6px;color:var(--ink)}
.letter p{color:var(--ink);font-size:clamp(24px,6vw,32px);line-height:1.35}
/* hanging polaroids */
.strip{position:relative;width:100%;max-width:720px;height:clamp(270px,62vw,360px)}
.strip svg{position:absolute;inset:0;width:100%;height:60px;overflow:visible}
.pol{position:absolute;width:15.5%;background:#fff;padding:5px 5px 22px;box-shadow:0 8px 16px rgba(0,0,0,.3);cursor:pointer;transform-origin:50% 0;animation:sway 4s ease-in-out infinite;transition:transform .2s}
.pol:hover{animation-duration:1s}
.pol i{position:absolute;left:50%;top:-12px;width:12px;height:26px;margin-left:-6px;border-radius:3px;background:var(--pc);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.pol div{aspect-ratio:1;background:linear-gradient(135deg,#ffd0df,#d86a92);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,40px);overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover}
@keyframes sway{0%,100%{rotate:calc(var(--r)*1deg)}50%{rotate:calc(var(--r)*1deg + 4deg)}}
.hint{font-size:clamp(22px,5.5vw,28px);opacity:.9}
/* gift */
.gift{font-size:clamp(120px,36vw,200px);cursor:pointer;background:none;border:0;box-shadow:none;text-decoration:none;padding:0;animation:bob 1.8s ease-in-out infinite}
.gift.pop{animation:pop .6s forwards}@keyframes pop{to{transform:scale(1.7) rotate(12deg);opacity:0}}
/* hug scene */
#hugsvg{width:min(92vw,520px);height:auto;cursor:pointer;overflow:visible}
#hugsvg .bd{fill:var(--bf);stroke:var(--bs);stroke-width:3}
#hugsvg .w{--bf:#fffaf4;--bs:#8b5e4b}#hugsvg .b{--bf:#c48a63;--bs:#6b4130}
.cl,.cr{transform:translateX(-95px)}.cr{transform:translateX(95px)}
.go .cl{animation:walk 1.3s cubic-bezier(.3,1.35,.5,1) forwards}.go .cr{animation:walk 1.3s cubic-bezier(.3,1.35,.5,1) forwards;--s:1}
@keyframes walk{to{transform:translateX(0)}}
.afl,.afr{transform:rotate(0)}
.go .afl{animation:ahl .7s 1.3s ease forwards}.go .afr{animation:ahr .7s 1.3s ease forwards}
@keyframes ahl{to{transform:rotate(-98deg)}}@keyframes ahr{to{transform:rotate(98deg)}}
.eh{opacity:0}.go .eo{animation:off .01s 1.9s forwards}.go .eh{animation:on .01s 1.9s forwards}
@keyframes off{to{opacity:0}}@keyframes on{to{opacity:1}}
.go .sq{animation:sq 1.1s 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sq{50%{transform:scale(1.03,.96)}}
.hw{position:relative}.hw .hs{position:absolute;bottom:55%;font-size:30px;opacity:0;pointer-events:none}
.go .hs{animation:up 2.8s 2s ease-out infinite}.go .hs:nth-of-type(2){left:38%;animation-delay:2.6s}.go .hs:nth-of-type(3){left:50%;animation-delay:3.2s}.go .hs:nth-of-type(4){left:62%;animation-delay:2.9s}
@keyframes up{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) scale(1.2)}}
.snd{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;display:flex;gap:8px}.snd button{font-size:20px;padding:6px 11px;text-decoration:none;line-height:1;background:rgba(255,255,255,.85);color:#a8325e;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.fall{position:fixed;top:-40px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* Responsive polish: larger photos, hidden scrollbars, and phone-friendly layout */
html, body { width:100%; max-width:100%; overflow:hidden; scrollbar-width:none; -ms-overflow-style:none; }
html::-webkit-scrollbar, body::-webkit-scrollbar, .page::-webkit-scrollbar { display:none; width:0; height:0; }
#stage { width:100%; min-width:0; overflow:hidden; padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)); }
.page { width:100%; max-width:1000px; padding:clamp(10px,2.5vw,24px); gap:clamp(8px,1.7vh,16px); overflow-y:auto; scrollbar-width:none; }
.page::-webkit-scrollbar { display:none; }
.strip { width:min(96vw,980px); max-width:980px; height:clamp(340px,55vh,470px); flex:none; }
.pol { width:15.5%; padding:7px 7px 28px; }
.pol div { aspect-ratio: .92; }
.pol img { display:block; width:100%; height:100%; object-fit:cover; }
.snd { z-index:20; }
button { max-width:100%; font-size:clamp(18px,3.2vw,25px); }
@media (max-width: 650px) {
  #stage { padding-left:8px; padding-right:8px; }
  .page { gap:9px; padding:12px 8px; }
  h1 { font-size:clamp(38px,10vw,60px); }
  h2 { font-size:clamp(30px,8vw,44px); }
  p { font-size:clamp(21px,5.5vw,28px); }
  .strip { width:min(96vw,520px); height:clamp(410px,66vh,500px); }
  .pol { width:31%; padding:5px 5px 20px; }
  .pol i { top:-9px; width:9px; height:20px; margin-left:-4.5px; }
  .pol div { aspect-ratio:1; }
  .cat { width:clamp(115px,34vw,185px); }
  .row { flex-wrap:wrap; justify-content:center; }
  .snd button { min-width:44px; min-height:44px; }
}
@media (max-width: 360px) {
  .strip { height:410px; }
  h1 { font-size:38px; }
  .pol { width:32%; padding:4px 4px 17px; }
}


/* Final polish: readable message, larger photos, hidden scrollbars, mobile layout */
html, body { width:100%; max-width:100%; overflow:hidden; scrollbar-width:none; -ms-overflow-style:none; }
html::-webkit-scrollbar, body::-webkit-scrollbar, .page::-webkit-scrollbar { display:none; width:0; height:0; }
#stage { width:100%; min-width:0; overflow:hidden; padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)); }
.page { width:100%; max-width:1100px; min-width:0; padding:clamp(10px,2.5vw,24px); overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none; }
.page::-webkit-scrollbar { display:none; }
#letter .letter { width:min(100%, 850px); max-width:850px; padding:clamp(16px,3.5vw,34px); transform:none; }
#letterText { white-space:pre-line; overflow-wrap:anywhere; font-size:clamp(21px,3.4vw,30px); line-height:1.42; }
#letter .letter h3 { font-size:clamp(30px,5vw,46px); }
#love .strip { width:100%; max-width:1000px; height:clamp(360px,47vw,500px); flex-shrink:0; }
#love .pol { width:15.5%; padding:7px 7px 28px; }
#love .pol div { aspect-ratio:4/5; }
#love .pol img { width:100%; height:100%; object-fit:cover; }
.reset-btn { background:linear-gradient(135deg,#fff0f5,#f6b9cf); color:#8b1e3f; border:2px solid #fff; border-radius:18px; box-shadow:0 5px 0 #d98aa8; padding:10px 22px; font-size:clamp(20px,4vw,27px); text-decoration:none; }
.reset-btn:hover { transform:translateY(-2px); }
.snd { display:flex; gap:8px; }
.snd button { min-height:44px; padding:8px 14px; font-size:clamp(16px,3.5vw,22px); text-decoration:none; }
@media (max-width:650px) {
  #stage { align-items:flex-start; }
  .page { justify-content:center; gap:10px; }
  #love { justify-content:flex-start; }
  #love .strip { height:clamp(410px,125vw,520px); max-width:560px; }
  #love .pol { width:31%; padding:5px 5px 18px; }
  #love h1 { font-size:clamp(32px,9vw,48px); margin:8px 0 0; }
  #love .hint, #love #loveLine { margin:4px 0; }
  #letter .letter { margin:4px auto; }
  #letterText { font-size:clamp(19px,5vw,25px); line-height:1.38; }
  .row { gap:10px; }
  button { max-width:100%; padding:9px 20px; }
}
@media (max-width:380px) {
  #love .strip { height:400px; }
  #love .pol { width:32%; }
  #letterText { font-size:18px; }
}

</style>
</head>
<body data-p="ask">

<script>

const CONFIG = {
  name: "Nayab",
  askLine: "I made something special for you. Do you want to see?",
  bdayLine: "Happy Birthday Nayab 🎂❤️",
  greet: "Happy Birthday Nayab 🎂❤️",
  letter: "Happy Birthday Nayab 🎂❤️\nI miss you so much yaar, you are my jaan 🥺❤️ You are so far now but still so close to my heart. You are my comfort person hamesha. Life ke best days maine tumhare saath guzare hain, and I will always cherish them.\nAllah tumhe dher sari khushiyan de, tumhara naseeb bht acha kare. Kaash main wahan hoti tumhare saath cake cut karne ke liye, but I am sending you all my love and duas from far.\nLove you so much meri pyaari jan❤️❤️❤️❤️😍be Happy Always.\nDont forget I am always here for you🫂🫂❤️❤️",

let AC, master, started = false, musicOn = true, loopT, curRun, userAudio = null;
function ac(){ if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination); } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t, d, type, v, dest){ const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v || .2, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + .05); }
const MEL = [[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
function stopMusic(){
  clearTimeout(loopT);
  if (curRun) { curRun.disconnect(); curRun = null; }
  const music = $('bgMusic');
  if (music) music.pause();
  if (userAudio) userAudio.pause();
}
function startMusic(){
  stopMusic();
  if (!musicOn) return;
  const music = $('bgMusic');
  if (music) music.play().catch(() => { /* Tap the music button if autoplay is blocked. */ });
}
function sfx(n){
  if (!AC || !musicOn) return;
  const t = AC.currentTime;
  if (n === 'click') { tone(880, t, .12, 'sine', .18); tone(1320, t + .05, .12, 'sine', .12); }
  else if (n === 'buzz') { tone(140, t, .35, 'sawtooth', .12); tone(110, t + .1, .35, 'sawtooth', .1); }
  else if (n === 'pop') { tone(300, t, .15, 'square', .1); tone(700, t + .08, .25, 'triangle', .18); }
  else if (n === 'open') [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * .09, .4, 'sine', .16));
  else if (n === 'cheer') [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, t + i * .1, .6, 'triangle', .14));
}
addEventListener('pointerdown', e => {
  if (started || e.target.closest('.snd')) return;
  started = true;
  if (musicOn) startMusic();
});
$('mute').onclick = () => {
  musicOn = !musicOn;
  $('mute').textContent = musicOn ? 'Sound on' : 'Sound off';
  if (musicOn) { started = true; startMusic(); }

};
$('song').setAttribute('aria-label', 'Play background music audio.mp3');
$('song').title = 'Play background music';
$('song').textContent = 'Play music';
$('song').onclick = () => {

  $('mute').textContent = 'Sound on';
  startMusic();
};
$('aud').onchange = () => { const f = $('aud').files[0]; if (!f) return; stopMusic(); userAudio = new Audio(URL.createObjectURL(f)); userAudio.loop = true; musicOn = true; started = true; $('mute').textContent = '🔊'; startMusic(); $('aud').value = ''; };

function reset(){
  target = null;
  document.querySelectorAll('.pol img').forEach((img, i) => { img.src = `photo${i + 1}.jpeg`; });
  $('envsvg').classList.remove('open'); $('hugsvg').classList.remove('go'); show('ask');
}
$('reset').onclick = reset;

let heartCol = '#f08fb0';
function show(id){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === id));
  document.body.dataset.p = id;
  setTimeout(() => { heartCol = getComputedStyle(document.body).getPropertyValue('--h').trim() || heartCol; }, 50);
  sfx({dare:'buzz',bday:'cheer',hug:'cheer'}[id] || 'click');
  if (id === 'bday') confetti(['🎉','🎂','💗','✨']);
  if (id === 'env') $('envsvg').classList.remove('open');
  if (id === 'hug') hug();
  burst(innerWidth / 2, innerHeight / 2, 18);
}
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t) show(t.dataset.go); });

// envelope opens, then the letter appears
function openEnvelope(){
  const s = $('envsvg');
  if (s.classList.contains('open')) return;
  s.classList.add('open');
  sfx('open');
  setTimeout(() => show('letter'), 1500);
}
$('envsvg').addEventListener('click', openEnvelope);
$('envsvg').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    openEnvelope();
  }
});
$('giftBox').addEventListener('click', e => {
  const b = e.currentTarget; b.classList.add('pop'); sfx('pop');
  setTimeout(() => { b.classList.remove('pop'); show('hug'); }, 600);
});

// the hug
function hug(){ const s = $('hugsvg'); s.classList.remove('go'); void s.getBoundingClientRect(); s.classList.add('go'); }
$('again').onclick = () => { hug(); confetti(['💖','🤍','🌸']); };
$('hugsvg').onclick = () => { hug(); };

// hanging polaroids
const strip = $('strip'), file = $('file'); let target = null;
const pegs = ['#7ed6c9','#b79cf2','#ffd36e','#8ec5ff','#f49ac2','#a5d6a7'];
const tops = [28,72,42,92,28,72], rots = [-6,3,-3,5,-4,4];
const photoCards = [];
function layoutPhotos() {
  const mobile = window.matchMedia('(max-width: 650px)').matches;
  const mobileLeft = [7, 58, 7, 58, 7, 58];
  const mobileTop = [24, 24, 160, 160, 296, 296];
  photoCards.forEach((p, i) => {
    p.style.left = mobile ? mobileLeft[i] + '%' : (1 + i * 16.2) + '%';
    p.style.top = mobile ? mobileTop[i] + 'px' : tops[i] + 'px';
    p.style.width = mobile ? '31%' : '15.5%';
  });
}
for (let i = 0; i < 6; i++) {
  const p = document.createElement('div');
  p.className = 'pol';
  p.style.cssText = `--r:${rots[i]};--pc:${pegs[i]};animation-delay:${-i}s`;
  p.innerHTML = `<i></i><div><img src="photo${i + 1}.jpeg" alt="Photo ${i + 1}" onerror="this.parentElement.textContent='📷'"></div>`;
  p.onclick = () => { target = p; file.click(); };
  strip.appendChild(p); photoCards.push(p);
}
layoutPhotos();
window.addEventListener('resize', layoutPhotos, { passive:true });
file.onchange = () => {
  const f = file.files[0]; if (!f || !target) return;
  const r = new FileReader();
  r.onload = () => { target.querySelector('div').innerHTML = '<img alt="photo" src="' + r.result + '">'; };
  r.readAsDataURL(f); file.value = '';
};

function confetti(set){
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    s.className = 'fall'; s.textContent = set[i % set.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = 18 + Math.random() * 24 + 'px';
    s.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
    s.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 7000);
  }
}

// ✨ interactive background: hearts drift up, dodge your finger/cursor, burst when you tap
const cv = $('bg'), ctx = cv.getContext('2d');
let W, H, hearts = [], bits = [], ptr = {x: -999, y: -999}, ptrT;
function seed(){
  const n = Math.round(Math.max(14, Math.min(46, W * H / 26000)));
  while (hearts.length < n) hearts.push(mk(true));
  hearts.length = n;
}
function mk(any){ return {x: Math.random() * W, y: any ? Math.random() * H : H + 30, s: 6 + Math.random() * 14, v: .3 + Math.random() * .7, ph: Math.random() * 6, r: (Math.random() - .5) * .6, a: .25 + Math.random() * .4, dx: 0, dy: 0}; }
function size(){
  const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); seed();
}
addEventListener('resize', size); size();
function hp(x, y, s, r){
  ctx.save(); ctx.translate(x, y); ctx.rotate(r); ctx.scale(s, s); ctx.beginPath();
  ctx.moveTo(0, .9); ctx.bezierCurveTo(-1.2, .1, -.9, -.9, 0, -.35); ctx.bezierCurveTo(.9, -.9, 1.2, .1, 0, .9); ctx.fill(); ctx.restore();
}
function burst(x, y, n){ for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 1.5 + Math.random() * 3.5; bits.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, l: 1, s: 5 + Math.random() * 9}); } }
let t = 0;
(function loop(){
  t += .016; ctx.clearRect(0, 0, W, H); ctx.fillStyle = heartCol;
  for (const h of hearts) {
    const ddx = h.x - ptr.x, ddy = h.y - ptr.y, d2 = ddx * ddx + ddy * ddy;
    if (d2 < 15000) { const f = (15000 - d2) / 15000 * 3, d = Math.sqrt(d2) || 1; h.dx += ddx / d * f; h.dy += ddy / d * f; }
    h.dx *= .9; h.dy *= .9;
    h.y -= h.v; h.x += Math.sin(t + h.ph) * .4 + h.dx; h.y += h.dy;
    if (h.y < -30) Object.assign(h, mk(false));
    ctx.globalAlpha = h.a; hp(h.x, h.y, h.s, h.r + Math.sin(t + h.ph) * .2);
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.x += b.vx; b.y += b.vy; b.vy += .08; b.l -= .018;
    if (b.l <= 0) { bits.splice(i, 1); continue; }
    ctx.globalAlpha = b.l; hp(b.x, b.y, b.s * b.l + 2, b.x * .01);
  }
  ctx.globalAlpha = 1; requestAnimationFrame(loop);
})();
addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; clearTimeout(ptrT); ptrT = setTimeout(() => ptr.x = ptr.y = -999, 900);
  const r = document.documentElement.style; r.setProperty('--mx', (e.clientX / W - .5).toFixed(3)); r.setProperty('--my', (e.clientY / H - .5).toFixed(3));
});
addEventListener('pointerdown', e => { burst(e.clientX, e.clientY, 14); ptr.x = e.clientX; ptr.y = e.clientY; });
addEventListener('deviceorientation', e => { // phone tilt moves the background shapes
  if (e.gamma == null) return; const r = document.documentElement.style;
  r.setProperty('--mx', Math.max(-.5, Math.min(.5, e.gamma / 60)).toFixed(3)); r.setProperty('--my', Math.max(-.5, Math.min(.5, (e.beta - 40) / 80)).toFixed(3));
});
</script>
</body>
